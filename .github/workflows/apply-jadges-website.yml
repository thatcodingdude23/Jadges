name: Apply Jadges website

on:
  push:
    branches:
      - main
    paths:
      - ".github/jadges-website-trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Integrate website routes
        run: python scripts/apply-jadges-website.py

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Commit verified website
        run: |
          rm -f scripts/apply-jadges-website.py
          rm -f .github/jadges-website-trigger
          rm -f .github/workflows/apply-jadges-website.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Launch Jadges website dashboard"
          git push
