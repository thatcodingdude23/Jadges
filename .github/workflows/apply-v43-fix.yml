name: Apply v43 username span fix

on:
  push:
    branches:
      - fix/all-username-spans-author-v43

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/all-username-spans-author-v43
      - name: Apply exact changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          updater = Path('vencord-plugin/jadgesBadges/updater.ts')
          text = updater.read_text()
          text = text.replace('const CURRENT_UPDATE_VERSION = 42;', 'const CURRENT_UPDATE_VERSION = 43;')
          old = '''        const root = profileRoot(displayTarget);\n        if (!root) continue;\n        cleanupOldBlocks(root);\n        const userId = profileUserId(root);\n        if (!userId) continue;\n        const profile = profiles[userId];'''
          new = '''        const root = profileRoot(displayTarget) || displayTarget.parentElement || document.body;\n        cleanupOldBlocks(root);\n        let userId = profileUserId(root);\n        if (!userId) {\n            const originalValue = displayTarget.dataset.jadgesOriginalDisplayName\n                || displayTarget.getAttribute("data-username-with-effects")\n                || displayTarget.textContent?.trim();\n            if (originalValue) {\n                userId = Object.keys(profiles).find(id => {\n                    const user = UserStore.getUser(id);\n                    return user?.username === originalValue || user?.globalName === originalValue;\n                });\n            }\n        }\n        if (!userId) continue;\n        const profile = profiles[userId];'''
          if old not in text:
              raise SystemExit('display span block not found')
          text = text.replace(old, new)
          updater.write_text(text)

          index = Path('vencord-plugin/jadgesBadges/index.tsx')
          text = index.read_text()
          text = text.replace('authors: [{ name: "Jaycord", id: 0n }],', 'authors: [{ name: "jayden", id: 1439230248100036798n }],')
          index.write_text(text)

          server = Path('src/vencordUpdateDashboardIntegration.ts')
          text = server.read_text()
          text = re.sub(r'const UPDATE_VERSION = \d+;', 'const UPDATE_VERSION = 43;', text)
          server.write_text(text)

          manifest = Path('vencord-plugin/update.json')
          text = manifest.read_text()
          text = re.sub(r'"version"\s*:\s*\d+', '"version": 43', text, count=1)
          manifest.write_text(text)

          publish = Path('.github/workflows/publish-jadges-update.yml')
          text = publish.read_text()
          text = re.sub(r'version = \d+', 'version = 43', text)
          text = re.sub(r'jadgesBadges-v\d+\.zip', 'jadgesBadges-v43.zip', text)
          text = re.sub(r'Vencord v\d+ ZIP', 'Vencord v43 ZIP', text)
          publish.write_text(text)

          Path('.github/workflows/apply-v43-fix.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update all username effect spans and plugin author"
          git push origin HEAD:fix/all-username-spans-author-v43
