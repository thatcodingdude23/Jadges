name: Finalize v43 package

on:
  push:
    branches:
      - fix/global-name-sync-v43

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-name-sync-v43
      - name: Bump v43 sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          updater = Path('vencord-plugin/jadgesBadges/updater.ts')
          updater.write_text(updater.read_text().replace(
              'const CURRENT_UPDATE_VERSION = 42;',
              'const CURRENT_UPDATE_VERSION = 43;'
          ))

          server = Path('src/vencordUpdateDashboardIntegration.ts')
          server.write_text(re.sub(r'const UPDATE_VERSION = \d+;', 'const UPDATE_VERSION = 43;', server.read_text()))

          manifest = Path('vencord-plugin/update.json')
          manifest.write_text(re.sub(r'"version"\s*:\s*\d+', '"version": 43', manifest.read_text(), count=1))

          publish = Path('.github/workflows/publish-jadges-update.yml')
          text = publish.read_text()
          text = re.sub(r'version = \d+', 'version = 43', text)
          text = re.sub(r'jadgesBadges-v\d+\.zip', 'jadgesBadges-v43.zip', text)
          text = re.sub(r'Vencord v\d+ ZIP', 'Vencord v43 ZIP', text)
          publish.write_text(text)

          Path('__trigger_v43').unlink(missing_ok=True)
          Path('.github/workflows/apply-v43-fix.yml').unlink()
          PY
      - name: Commit v43 package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Vencord v43 package"
          git push origin HEAD:fix/global-name-sync-v43
