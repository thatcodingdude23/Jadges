name: Apply v44 loader and panel fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v44 changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('vencord-plugin/jadgesBadges/index.tsx')
          text = index.read_text()
          text = text.replace(
              "const USER_TAG_SELECTOR = 'span[class*=\"userTagUsername_\"]';",
              "const USER_TAG_SELECTOR = 'span[class*=\"userTagUsername_\"]';\nconst PANEL_USERNAME_SELECTOR = '[class*=\"panelSubtextContainer_\"] [class*=\"hovered_\"]';"
          )

          marker = '''            if (!scope) continue;\n            for (const userTag of scope.querySelectorAll<HTMLElement>(USER_TAG_SELECTOR)) {\n                if (!userTag.dataset.jadgesOriginalUserTag) {\n                    userTag.dataset.jadgesOriginalUserTag = userTag.textContent?.trim() || original;\n                }\n                userTag.textContent = customName;\n            }\n        }'''
          replacement = '''            if (scope) {\n                for (const userTag of scope.querySelectorAll<HTMLElement>(USER_TAG_SELECTOR)) {\n                    if (!userTag.dataset.jadgesOriginalUserTag) {\n                        userTag.dataset.jadgesOriginalUserTag = userTag.textContent?.trim() || original;\n                    }\n                    userTag.textContent = customName;\n                }\n            }\n        }\n\n        for (const panelName of document.querySelectorAll<HTMLElement>(PANEL_USERNAME_SELECTOR)) {\n            const original = panelName.dataset.jadgesPanelOriginalName || panelName.textContent?.trim();\n            if (!original) continue;\n            const userId = matchingProfileId(original, profiles);\n            const customName = userId ? profiles[userId]?.username?.trim() : undefined;\n            if (!customName) continue;\n            if (!panelName.dataset.jadgesPanelOriginalName) {\n                panelName.dataset.jadgesPanelOriginalName = original;\n            }\n            panelName.textContent = customName;\n        }'''
          if marker not in text:
              raise SystemExit('global name scope block not found')
          text = text.replace(marker, replacement)

          stop_marker = '''    for (const span of document.querySelectorAll<HTMLElement>(DISPLAY_NAME_SELECTOR)) {\n        const original = span.dataset.jadgesGlobalOriginalName;\n        if (!original) continue;\n        span.textContent = original;\n        span.setAttribute("data-username-with-effects", original);\n        delete span.dataset.jadgesGlobalOriginalName;\n    }\n}'''
          stop_replacement = '''    for (const span of document.querySelectorAll<HTMLElement>(DISPLAY_NAME_SELECTOR)) {\n        const original = span.dataset.jadgesGlobalOriginalName;\n        if (!original) continue;\n        span.textContent = original;\n        span.setAttribute("data-username-with-effects", original);\n        delete span.dataset.jadgesGlobalOriginalName;\n    }\n    for (const panelName of document.querySelectorAll<HTMLElement>(PANEL_USERNAME_SELECTOR)) {\n        const original = panelName.dataset.jadgesPanelOriginalName;\n        if (!original) continue;\n        panelName.textContent = original;\n        delete panelName.dataset.jadgesPanelOriginalName;\n    }\n}'''
          if stop_marker not in text:
              raise SystemExit('global name stop block not found')
          index.write_text(text.replace(stop_marker, stop_replacement))

          native = Path('vencord-plugin/jadgesBadges/updateNative.ts')
          text = native.read_text()
          old = '''                void updateInstaller(ui, {\n                    percent: progress,\n                    status: "Building Vencord…",\n                    log: `[${source}] ${clean}`,\n                    logType: source === "error" ? "error" : undefined\n                });'''
          new = '''                const actualError = source === "error"\n                    && /(?:^|\\b)(?:error|failed|failure|fatal|exception|enoent|eacces)(?:\\b|:)/i.test(clean);\n                const label = actualError ? "error" : "build";\n                void updateInstaller(ui, {\n                    percent: progress,\n                    status: "Building Vencord…",\n                    log: `[${label}] ${clean}`,\n                    logType: actualError ? "error" : undefined\n                });'''
          if old not in text:
              raise SystemExit('build output block not found')
          native.write_text(text.replace(old, new))

          updater = Path('vencord-plugin/jadgesBadges/updater.ts')
          updater.write_text(updater.read_text().replace('const CURRENT_UPDATE_VERSION = 43;', 'const CURRENT_UPDATE_VERSION = 44;'))

          server = Path('src/vencordUpdateDashboardIntegration.ts')
          server.write_text(re.sub(r'const UPDATE_VERSION = \d+;', 'const UPDATE_VERSION = 44;', server.read_text()))

          manifest = Path('vencord-plugin/update.json')
          manifest.write_text(re.sub(r'"version"\s*:\s*\d+', '"version": 44', manifest.read_text(), count=1))

          publish = Path('.github/workflows/publish-jadges-update.yml')
          text = publish.read_text()
          text = re.sub(r'version = \d+', 'version = 44', text)
          text = re.sub(r'jadgesBadges-v\d+\.zip', 'jadgesBadges-v44.zip', text)
          text = re.sub(r'Vencord v\d+ ZIP', 'Vencord v44 ZIP', text)
          publish.write_text(text)

          Path('.github/workflows/apply-v44-fix.yml').unlink()
          PY
      - name: Commit v44 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix build log severity and sync account panel username"
          git push
