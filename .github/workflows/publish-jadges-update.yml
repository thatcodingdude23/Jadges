name: Publish Jadges update package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch final dashboard sidebar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/websiteIntegration.ts')
          text = path.read_text()

          replacement = r'''function installDashboardLinks(response: ServerResponse, includeAdmin: boolean): void {
  const originalEnd = response.end.bind(response);
  let ended = false;

  response.end = ((
    chunk?: any,
    encoding?: any,
    callback?: any,
  ): ServerResponse => {
    if (ended) return response;
    ended = true;

    if (
      chunk === undefined
      || response.statusCode < 200
      || response.statusCode >= 300
    ) {
      originalEnd(chunk, encoding, callback);
      return response;
    }

    const body = Buffer.isBuffer(chunk)
      ? chunk.toString("utf8")
      : chunk instanceof Uint8Array
        ? Buffer.from(chunk).toString("utf8")
        : String(chunk);

    const marker = `</nav>\n      <div class="sidebar-spacer">`;
    const customProfileLink = `<a class="nav-link" href="/custom-profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.4 3.5-7 8-7s7.2 2.6 8 7"/><path d="M18 4v4M16 6h4"/></svg>Custom Profile</a>`;
    const adminLink = `<a class="nav-link" href="/admin"><svg viewBox="0 0 24 24"><path d="M12 3 20 6v5c0 5-3.2 8.7-8 10-4.8-1.3-8-5-8-10V6l8-3Z"/><path d="M9.5 12.2 11.2 14l3.7-4"/></svg>Admin Panel</a>`;
    const links = `${customProfileLink}${includeAdmin ? `\n        ${adminLink}` : ""}\n      </nav>\n      <div class="sidebar-spacer">`;

    const nextBody = !body.includes('href="/custom-profile"') && body.includes(marker)
      ? body.replace(marker, links)
      : body;

    originalEnd(nextBody, "utf8", callback);
    return response;
  }) as typeof response.end;
}'''

          function_pattern = r'function installAdminDashboardLink\(response: ServerResponse\): void \{.*?\n\}\n\nfunction wrap'
          text, count = re.subn(function_pattern, replacement + '\n\nfunction wrap', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('dashboard link function was not replaced')

          call_pattern = r'''          if \(\n            url\.pathname === "/dashboard"\n            && await canAccessAdminPanel\(userId\)\n          \) \{\n            installAdminDashboardLink\(response\);\n          \}'''
          call_replacement = '''          if (url.pathname === "/dashboard") {
            installDashboardLinks(response, await canAccessAdminPanel(userId));
          }'''
          text, count = re.subn(call_pattern, call_replacement, text, count=1)
          if count != 1:
              raise SystemExit('dashboard link call was not replaced')

          path.write_text(text)
          Path('__trigger_sidebar_fix_2').unlink(missing_ok=True)
          Path('__trigger_sidebar_fix').unlink(missing_ok=True)
          PY
      - name: Commit sidebar fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add Custom Profile to final dashboard sidebar"
          git push
