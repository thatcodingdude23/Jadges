name: Publish Jadges update package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish v46
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          updater = Path('vencord-plugin/jadgesBadges/updater.ts')
          updater.write_text(re.sub(r'const CURRENT_UPDATE_VERSION = \d+;', 'const CURRENT_UPDATE_VERSION = 46;', updater.read_text()))

          server = Path('src/vencordUpdateDashboardIntegration.ts')
          server.write_text(re.sub(r'const UPDATE_VERSION = \d+;', 'const UPDATE_VERSION = 46;', server.read_text()))

          Path('vencord-plugin/update.json').write_text(json.dumps({'version': 46}, indent=2) + '\n')
          Path('__trigger_v46').unlink(missing_ok=True)
          PY
      - name: Commit v46
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish Jadges Vencord v46"
          git push
