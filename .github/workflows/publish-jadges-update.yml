name: Publish Jadges update package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate manifest and downloadable ZIP
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          version = 33
          root = Path("vencord-plugin/jadgesBadges")
          names = [
              "index.tsx",
              "base.tsx",
              "customProfileSync.ts",
              "native.ts",
              "style.css",
              "updater.ts",
              "updateNative.ts",
          ]

          manifest = {
              "version": version,
              "files": [
                  {
                      "path": name,
                      "sha256": hashlib.sha256((root / name).read_bytes()).hexdigest(),
                  }
                  for name in names
              ],
          }

          Path("vencord-plugin/update.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )

          output = Path("dist/jadgesBadges-v33.zip")
          output.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for file in sorted(root.rglob("*")):
                  if file.is_file():
                      archive.write(file, Path("jadgesBadges") / file.relative_to(root))
              archive.writestr(
                  "INSTALL.txt",
                  "1. Close Discord.\n"
                  "2. Open your Vencord\\src\\userplugins folder.\n"
                  "3. Delete the old jadgesBadges folder.\n"
                  "4. Extract the jadgesBadges folder from this ZIP into userplugins.\n"
                  "5. In the Vencord folder, run: pnpm build\n"
                  "6. Open Discord again.\n\n"
                  "This package includes the repaired custom profile renderer.\n",
              )
          PY

      - name: Commit generated package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vencord-plugin/update.json dist/jadgesBadges-v33.zip
          git diff --cached --quiet && exit 0
          git commit -m "Publish Jadges Vencord v33 ZIP"
          git push
