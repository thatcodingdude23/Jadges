name: Publish Jadges update package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply v45 global name sync and generate package
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import zipfile
          from pathlib import Path

          version = 45
          index = Path("vencord-plugin/jadgesBadges/index.tsx")
          text = index.read_text()

          if "SURFACE_NAME_SELECTOR" not in text:
              text = text.replace(
                  "const PANEL_USERNAME_SELECTOR = '[class*=\"panelSubtextContainer_\"] [class*=\"hovered_\"]';",
                  '''const PANEL_USERNAME_SELECTOR = '[class*="panelSubtextContainer_"] [class*="hovered_"]';
const SURFACE_NAME_SELECTOR = [
    '[class*="messageListItem_"] [class*="username_"]',
    '[class*="message_"] [class*="username_"]',
    '[class*="members_"] [class*="username_"]',
    '[class*="member_"] [class*="username_"]',
    '[class*="privateChannels_"] [class*="name_"]',
    '[class*="channel_"] [class*="name_"]'
].join(",");'''
              )

              marker = '''        for (const panelName of document.querySelectorAll<HTMLElement>(PANEL_USERNAME_SELECTOR)) {
            const original = panelName.dataset.jadgesPanelOriginalName || panelName.textContent?.trim();
            if (!original) continue;
            const userId = matchingProfileId(original, profiles);
            const customName = userId ? profiles[userId]?.username?.trim() : undefined;
            if (!customName) continue;
            if (!panelName.dataset.jadgesPanelOriginalName) {
                panelName.dataset.jadgesPanelOriginalName = original;
            }
            panelName.textContent = customName;
        }'''
              replacement = marker + '''

        for (const nameElement of document.querySelectorAll<HTMLElement>(SURFACE_NAME_SELECTOR)) {
            if (nameElement.matches(DISPLAY_NAME_SELECTOR) || nameElement.closest('[data-jadges-original-name]')) continue;
            const original = nameElement.dataset.jadgesSurfaceOriginalName || nameElement.textContent?.trim();
            if (!original) continue;
            const userId = matchingProfileId(original, profiles);
            const customName = userId ? profiles[userId]?.username?.trim() : undefined;
            if (!customName) continue;
            if (!nameElement.dataset.jadgesSurfaceOriginalName) {
                nameElement.dataset.jadgesSurfaceOriginalName = original;
            }
            nameElement.textContent = customName;
        }'''
              if marker not in text:
                  raise SystemExit("panel username sync block not found")
              text = text.replace(marker, replacement)

              stop_marker = '''    for (const panelName of document.querySelectorAll<HTMLElement>(PANEL_USERNAME_SELECTOR)) {
        const original = panelName.dataset.jadgesPanelOriginalName;
        if (!original) continue;
        panelName.textContent = original;
        delete panelName.dataset.jadgesPanelOriginalName;
    }
}'''
              stop_replacement = '''    for (const panelName of document.querySelectorAll<HTMLElement>(PANEL_USERNAME_SELECTOR)) {
        const original = panelName.dataset.jadgesPanelOriginalName;
        if (!original) continue;
        panelName.textContent = original;
        delete panelName.dataset.jadgesPanelOriginalName;
    }
    for (const nameElement of document.querySelectorAll<HTMLElement>(SURFACE_NAME_SELECTOR)) {
        const original = nameElement.dataset.jadgesSurfaceOriginalName;
        if (!original) continue;
        nameElement.textContent = original;
        delete nameElement.dataset.jadgesSurfaceOriginalName;
    }
}'''
              if stop_marker not in text:
                  raise SystemExit("panel username restore block not found")
              text = text.replace(stop_marker, stop_replacement)
              index.write_text(text)

          updater = Path("vencord-plugin/jadgesBadges/updater.ts")
          updater.write_text(re.sub(r"const CURRENT_UPDATE_VERSION = \d+;", "const CURRENT_UPDATE_VERSION = 45;", updater.read_text()))

          server = Path("src/vencordUpdateDashboardIntegration.ts")
          server.write_text(re.sub(r"const UPDATE_VERSION = \d+;", "const UPDATE_VERSION = 45;", server.read_text()))

          root = Path("vencord-plugin/jadgesBadges")
          names = ["index.tsx", "base.tsx", "customProfileSync.ts", "native.ts", "style.css", "updater.ts", "updateNative.ts"]
          manifest = {
              "version": version,
              "files": [{"path": name, "sha256": hashlib.sha256((root / name).read_bytes()).hexdigest()} for name in names],
          }
          Path("vencord-plugin/update.json").write_text(json.dumps(manifest, indent=2) + "\n")

          output = Path("dist/jadgesBadges-v45.zip")
          output.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for file in sorted(root.rglob("*")):
                  if file.is_file():
                      archive.write(file, Path("jadgesBadges") / file.relative_to(root))
              archive.writestr("INSTALL.txt", "Install the jadgesBadges folder, run pnpm build, then restart Discord.\n")
          PY

      - name: Commit generated v45 package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish Jadges Vencord v45 ZIP"
          git push
