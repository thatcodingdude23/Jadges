name: Apply custom profile dashboard integration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate custom profile into dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          website = Path('src/website.ts')
          text = website.read_text()
          nav = '''        <a class="nav-link" href="#appearance"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-1 1.5-2-.7-1.5.4-3 2-3h2.2A3.3 3.3 0 0 0 21 12.7 9.7 9.7 0 0 0 12 3Z"/><path d="M7.5 10h.01M9 6.8h.01M14 6.5h.01M17 9h.01"/></svg>Appearance</a>'''
          custom = nav + '''\n        <a class="nav-link" href="/custom-profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.4 3.5-7 8-7s7.2 2.6 8 7"/><path d="M18 4v4M16 6h4"/></svg>Custom Profile</a>'''
          if '/custom-profile' not in text[text.find('function dashboardPage'):text.find('function errorPage')]:
              if nav not in text:
                  raise SystemExit('dashboard appearance nav not found')
              text = text.replace(nav, custom, 1)
              website.write_text(text)

          integration = Path('src/customProfileIntegration.ts')
          text = integration.read_text()
          new_page = r'''function page(profile: CustomProfile, saved: boolean): string {
  const date = profile.createdAt ? profile.createdAt.slice(0, 10) : "";
  const username = escapeHtml(profile.username || "");
  const safeDate = escapeHtml(date);
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom Profile — Jadges</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#070b14;color:#f7f8fc}.shell{min-height:100vh;display:grid;grid-template-columns:238px 1fr}.sidebar{position:sticky;top:0;height:100vh;padding:24px 16px;background:#080d17;border-right:1px solid #1a2233;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:13px;color:#fff;text-decoration:none;font-weight:850;font-size:20px;padding:0 10px 24px}.brand-mark{width:27px;height:36px;border:4px solid #7c5cff;border-top:0;border-right:0;border-radius:0 0 0 15px;transform:rotate(-1deg)}.nav{display:grid;gap:8px}.nav a{display:flex;align-items:center;gap:13px;min-height:44px;padding:0 13px;border-radius:11px;color:#9ca8bd;text-decoration:none;font-weight:760}.nav a:hover{background:#11182a;color:#fff}.nav a.active{background:#201c51;color:#fff;border:1px solid #39317b}.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}.spacer{flex:1}.foot{font-size:12px;color:#647087;padding:14px 10px}.main{min-width:0}.topbar{height:76px;border-bottom:1px solid #192235;display:flex;align-items:center;justify-content:flex-end;padding:0 32px;background:rgba(7,11,20,.82);backdrop-filter:blur(14px)}.back{color:#aab4c8;text-decoration:none;font-weight:750}.content{width:min(1120px,calc(100% - 48px));margin:0 auto;padding:42px 0 70px}.heading{margin-bottom:28px}.eyebrow{color:#8d7cff;font-size:12px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}.heading h1{font-size:38px;line-height:1.1;margin:8px 0 10px}.heading p{margin:0;color:#9ca8bd;max-width:690px}.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:24px;align-items:start}.panel{background:linear-gradient(180deg,#111827,#0d1422);border:1px solid #252f43;border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.24)}.editor{padding:26px}.panel-title{font-size:19px;font-weight:850;margin:0}.panel-copy{color:#909cb1;margin:7px 0 22px}.field{display:block;margin-top:18px;font-weight:800}.field span{display:block;margin-bottom:8px}.field small{display:block;color:#77849a;font-weight:550;margin-top:7px}.input{width:100%;height:48px;padding:0 14px;border:1px solid #303b52;border-radius:11px;background:#080e19;color:white;font:inherit;outline:none}.input:focus{border-color:#7c5cff;box-shadow:0 0 0 3px rgba(124,92,255,.15)}.notice{margin-top:20px;padding:14px 15px;border:1px solid #2a3550;border-radius:12px;background:#0a1221;color:#aeb8ca}.actions{display:flex;align-items:center;gap:12px;margin-top:22px}.save{border:0;border-radius:11px;background:linear-gradient(135deg,#7657ff,#5f7cff);color:#fff;padding:12px 18px;font:inherit;font-weight:850;cursor:pointer}.reset{border:1px solid #303b52;border-radius:11px;background:transparent;color:#cbd2df;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer}.saved{margin-bottom:18px;padding:12px 14px;border:1px solid #235c42;border-radius:11px;background:#0e2b20;color:#82e6ad;font-weight:750}.preview{overflow:hidden}.preview-top{padding:22px 24px;border-bottom:1px solid #242e41}.preview-body{padding:26px}.discord-card{overflow:hidden;border-radius:16px;background:#16181d;border:1px solid #30333b}.banner{height:96px;background:radial-gradient(circle at 18% 30%,rgba(154,119,255,.8),transparent 30%),linear-gradient(135deg,#322367,#19274f)}.profile{padding:0 18px 20px}.avatar{width:74px;height:74px;margin-top:-37px;border:6px solid #16181d;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7657ff,#35446d);font-size:28px;font-weight:900}.preview-name{font-size:21px;font-weight:900;margin-top:11px}.original{font-size:12px;color:#929aa8;margin-top:2px}.divider{height:1px;background:#33363d;margin:16px 0}.meta-title{font-size:11px;text-transform:uppercase;font-weight:850;color:#b9bec8}.meta-value{margin-top:5px;color:#e5e7eb}.helper{margin-top:16px;color:#7f8ba0;font-size:13px}.status{min-height:20px;color:#8ee3b0;font-weight:700;margin-left:auto}@media(max-width:820px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto;padding:14px}.brand{padding-bottom:12px}.nav{grid-template-columns:repeat(4,minmax(0,1fr))}.nav a{justify-content:center;font-size:0}.nav svg{width:21px;height:21px}.spacer,.foot{display:none}.topbar{display:none}.content{width:min(100% - 28px,720px);padding-top:28px}.grid{grid-template-columns:1fr}}
</style></head><body><div class="shell"><aside class="sidebar"><a class="brand" href="/"><span class="brand-mark"></span><span>Jadges</span></a><nav class="nav"><a href="/dashboard"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9H4v-9Z"/><path d="M9 20v-6h6v6"/></svg><span>Dashboard</span></a><a href="/dashboard#badges"><svg viewBox="0 0 24 24"><path d="m12 3 7 3v5c0 4.6-2.8 8.2-7 10-4.2-1.8-7-5.4-7-10V6l7-3Z"/><path d="m12 8 1.1 2.2 2.4.3-1.7 1.7.4 2.4-2.2-1.2-2.2 1.2.4-2.4-1.7-1.7 2.4-.3L12 8Z"/></svg><span>Badges</span></a><a href="/dashboard#appearance"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-1 1.5-2-.7-1.5.4-3 2-3h2.2A3.3 3.3 0 0 0 21 12.7 9.7 9.7 0 0 0 12 3Z"/></svg><span>Appearance</span></a><a class="active" href="/custom-profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.4 3.5-7 8-7s7.2 2.6 8 7"/><path d="M18 4v4M16 6h4"/></svg><span>Custom Profile</span></a></nav><div class="spacer"></div><div class="foot">Jadges Dashboard • Custom profiles</div></aside><main class="main"><header class="topbar"><a class="back" href="/dashboard">← Back to dashboard</a></header><div class="content"><div class="heading"><div class="eyebrow">Cosmetic identity</div><h1>Custom Profile</h1><p>Change how your username and account creation date look to people using a supported Jadges client. Your real Discord account is never changed.</p></div><div class="grid"><section class="panel editor">${saved ? '<div class="saved">Custom profile saved successfully.</div>' : ''}<h2 class="panel-title">Profile details</h2><p class="panel-copy">Leave either field blank to use the original Discord value.</p><form id="profile"><label class="field"><span>Custom username</span><input class="input" name="username" maxlength="32" value="${username}" placeholder="Enter a cosmetic name"><small>Used across profiles, messages, sidebars, and supported Jadges surfaces.</small></label><label class="field"><span>Custom account creation date</span><input class="input" name="createdAt" type="date" min="1900-01-01" value="${safeDate}"><small>Shown as the cosmetic Member Since date.</small></label><div class="notice">Jadges still shows the original username and original creation date underneath the cosmetic values.</div><div class="actions"><button class="save" type="submit">Save changes</button><button class="reset" id="reset" type="button">Clear custom profile</button><span class="status" id="status"></span></div></form></section><aside class="panel preview"><div class="preview-top"><h2 class="panel-title">Live preview</h2><p class="panel-copy">A separate visual style for your cosmetic profile.</p></div><div class="preview-body"><div class="discord-card"><div class="banner"></div><div class="profile"><div class="avatar">J</div><div class="preview-name" id="preview-name">${username || 'Your custom name'}</div><div class="original">Originally, your Discord username</div><div class="divider"></div><div class="meta-title">Member Since</div><div class="meta-value" id="preview-date">${safeDate || 'Original Discord date'}</div><div class="original">Originally, your real account creation date</div></div></div><p class="helper">This preview is cosmetic. Discord account data and authentication remain unchanged.</p></div></aside></div></div></main></div><script>
const form=document.getElementById('profile'),nameInput=form.elements.username,dateInput=form.elements.createdAt,status=document.getElementById('status');function updatePreview(){document.getElementById('preview-name').textContent=nameInput.value.trim()||'Your custom name';document.getElementById('preview-date').textContent=dateInput.value||'Original Discord date'}nameInput.addEventListener('input',updatePreview);dateInput.addEventListener('input',updatePreview);form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Saving…';const r=await fetch('/api/custom-profile',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:nameInput.value,createdAt:dateInput.value})});const j=await r.json();if(!r.ok){status.textContent=j.error||'Could not save';return}status.textContent='Saved';setTimeout(()=>location.href='/custom-profile?saved=1',350)});document.getElementById('reset').addEventListener('click',async()=>{nameInput.value='';dateInput.value='';updatePreview();status.textContent='Clearing…';const r=await fetch('/api/custom-profile',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:'',createdAt:''})});status.textContent=r.ok?'Cleared':'Could not clear'});
</script></body></html>`;
}'''
          pattern = r'function page\(profile: CustomProfile, saved: boolean\): string \{.*?\n\}\n\nfunction sendJson'
          if not re.search(pattern, text, flags=re.S):
              raise SystemExit('custom profile page function not found')
          text = re.sub(pattern, new_page + '\n\nfunction sendJson', text, count=1, flags=re.S)
          integration.write_text(text)

          Path('.github/workflows/apply-custom-profile-dashboard.yml').unlink()
          PY
      - name: Commit dashboard integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate custom profiles into dashboard navigation"
          git push
