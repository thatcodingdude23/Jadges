name: Rewrite history

on:
  issues:
    types:
      - opened

permissions:
  contents: write

jobs:
  rewrite:
    if: github.event.issue.title == 'rewrite jadges history'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace history with one clean commit
        run: |
          git config user.name "thatcodingdude23"
          git config user.email "152893832+thatcodingdude23@users.noreply.github.com"
          git checkout --orphan rewritten-main
          git add -A
          git commit -m "finish the plugin"
          git push origin rewritten-main:main --force
