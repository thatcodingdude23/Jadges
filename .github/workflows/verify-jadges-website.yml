name: Verify Jadges website

on:
  push:
    branches:
      - main
    paths:
      - ".github/verify-jadges-website-trigger"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Record successful verification
        run: |
          printf 'Verified at %s\n' "$(date -u +%FT%TZ)" > .github/jadges-website-verified
          rm -f .github/verify-jadges-website-trigger
          rm -f .github/workflows/verify-jadges-website.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Verify Jadges website build"
          git push
