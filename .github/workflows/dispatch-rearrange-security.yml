name: Dispatch rearrange security migration

on:
  push:
    paths:
      - ".github/rearrange-security-trigger"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Run security migration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run add-rearrange-link-security.yml --repo "${{ github.repository }}"
