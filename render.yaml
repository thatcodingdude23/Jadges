services:
  - type: web
    name: jadges
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: MAX_BADGES
        value: "5"
      - key: EXTRA_BOOST_BADGES
        value: "5"
      - key: MAX_BADGE_SIZE
        value: "5242880"
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: WEB_SESSION_SECRET
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: PROMPT_CHANNEL
        sync: false
      - key: VERIFIER_ROLE
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: JAYCORD_STAFF_BADGE_URL
        sync: false
      - key: BLACKLISTED_WORDS
        sync: false
    disk:
      name: jadges-data
      mountPath: /var/data
      sizeGB: 1
